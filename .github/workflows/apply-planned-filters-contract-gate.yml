name: Apply planned filters contract gate

on:
  push:
    branches:
      - chatgpt/planned-filters-contract-gate

permissions:
  contents: write
  issues: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch Codex patch and apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/issues/comments/5639027406 --jq .body > /tmp/codex-comment.md
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/codex-comment.md').read_text(encoding='utf-8')
          marker = '```diff\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n```', start)
          patch = text[start:end] + '\n'
          Path('/tmp/microstage3.diff').write_text(patch, encoding='utf-8')
          PY
          git apply --check /tmp/microstage3.diff
          git apply /tmp/microstage3.diff

      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-planned-filters-contract-gate.yml

      - name: Compile
        run: python -m compileall app

      - name: SQL analyzer tests
        run: python testar_sql_analysis.py

      - name: SQL contract tests
        run: python testar_sql_contract.py

      - name: Contract gate node tests
        run: python testar_contract_gate.py

      - name: SQL generation regression
        run: python testar_sql_generation.py

      - name: Diff check
        run: git diff --check

      - name: Commit transformed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add app/domain/sql_analysis.py app/domain/sql_contract.py testar_sql_analysis.py testar_sql_contract.py
          git commit -m 'feat: validate planned filters in contract gate'
          git push origin HEAD:chatgpt/planned-filters-contract-gate
