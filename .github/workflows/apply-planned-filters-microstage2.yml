name: Apply planned filters microstage 2

on:
  push:
    branches:
      - chatgpt/planned-filters-microstage-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply transformation
        run: python .github/scripts/apply_planned_filters_microstage2.py
      - name: Compile
        run: python -m compileall app
      - name: Planner tests
        run: python testar_planner.py
      - name: SQL generation tests
        run: python testar_sql_generation.py
      - name: Generate SQL node tests
        run: python testar_generate_sql.py
      - name: Diff check
        run: git diff --check
      - name: Commit transformed files
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: pass planned filters to sql generation"
          git push origin HEAD:chatgpt/planned-filters-microstage-2
