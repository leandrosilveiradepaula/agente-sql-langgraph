name: Crypto J1 MCP read-only validation

on:
  pull_request:
    paths:
      - "deploy/vps-mcp-g5/crypto_j1_readonly.py"
      - "deploy/vps-mcp-g5/cia_j1_sqlite_owner_sidecar.py"
      - "deploy/vps-mcp-g5/cia-j1-owner-sqlite.service"
      - "deploy/vps-mcp-g5/test_cia_j1_owner_sidecar.py"
      - "deploy/vps-mcp-g5/upgrade_cia_j1_owner_once.sh"
      - "deploy/vps-mcp-g5/test_crypto_j1_readonly.py"
      - "deploy/vps-mcp-g5/mcp_server.py"
      - "deploy/vps-mcp-g5/operations_broker.py"
      - "deploy/vps-mcp-g5/CIA-J1-MCP-RUNBOOK.md"
      - "deploy/vps-mcp-g5/upgrade_cia_j1_readonly_once.sh"
      - "deploy/vps-mcp-g5/upgrade_g5_diagnostics_once.sh"
      - ".github/workflows/crypto-j1-mcp-readonly.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/vps-mcp-g5/crypto_j1_readonly.py"
      - "deploy/vps-mcp-g5/cia_j1_sqlite_owner_sidecar.py"
      - "deploy/vps-mcp-g5/cia-j1-owner-sqlite.service"
      - "deploy/vps-mcp-g5/test_cia_j1_owner_sidecar.py"
      - "deploy/vps-mcp-g5/upgrade_cia_j1_owner_once.sh"
      - "deploy/vps-mcp-g5/test_crypto_j1_readonly.py"
      - "deploy/vps-mcp-g5/mcp_server.py"
      - "deploy/vps-mcp-g5/operations_broker.py"
      - "deploy/vps-mcp-g5/upgrade_cia_j1_readonly_once.sh"
      - "deploy/vps-mcp-g5/upgrade_g5_diagnostics_once.sh"
      - ".github/workflows/crypto-j1-mcp-readonly.yml"

permissions:
  contents: read

jobs:
  j1-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compile fixed-scope modules
        run: python3 -B -m py_compile deploy/vps-mcp-g5/crypto_j1_readonly.py deploy/vps-mcp-g5/cia_j1_sqlite_owner_sidecar.py deploy/vps-mcp-g5/mcp_server.py deploy/vps-mcp-g5/operations_broker.py
      - name: Shell syntax for upgrade/rollback entrypoints
        run: |
          bash -n deploy/vps-mcp-g5/upgrade_cia_j1_readonly_once.sh
          bash -n deploy/vps-mcp-g5/upgrade_g5_diagnostics_once.sh
          bash -n deploy/vps-mcp-g5/upgrade_cia_j1_owner_once.sh
      - name: Validate owner service sandbox and no capability upgrade
        run: |
          grep -q '^User=cia-probe
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_crypto_j1_readonly.py' -v
 deploy/vps-mcp-g5/cia-j1-owner-sqlite.service
          grep -q '^NoNewPrivileges=yes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_crypto_j1_readonly.py' -v
 deploy/vps-mcp-g5/cia-j1-owner-sqlite.service
          grep -q '^CapabilityBoundingSet=
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_crypto_j1_readonly.py' -v
 deploy/vps-mcp-g5/cia-j1-owner-sqlite.service
          grep -q '^ProtectHome=read-only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_crypto_j1_readonly.py' -v
 deploy/vps-mcp-g5/cia-j1-owner-sqlite.service
      - name: Run broker-owner boundary tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_cia_j1_owner_sidecar.py' -v
      - name: Run entirely offline read-only evidence tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s deploy/vps-mcp-g5 -p 'test_crypto_j1_readonly.py' -v
