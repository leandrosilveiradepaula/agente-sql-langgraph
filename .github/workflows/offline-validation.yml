name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline validation on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import smoke
        run: python scripts/check_imports.py

      - name: Network guard
        run: python scripts/check_no_network.py

      - name: Full offline checks
        run: python scripts/check_all.py

      - name: Hardcode scan
        run: python scripts/check_hardcodes.py

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Clean-room validation
        run: python scripts/check_clean_room.py

      - name: Whitespace check
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
            git rev-parse --verify $base
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --check "$base...HEAD"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ("${{ github.event_name }}" -eq "push") {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  shadow-image-import-smoke:
    name: Shadow image non-root import smoke on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reproduce restrictive checkout permissions
        run: |
          chmod 700 app/test_runtime
          chmod 600 app/test_runtime/sql_agent_test_app.py
          chmod 600 app/test_runtime/composition.py
      - name: Build real Shadow image
        run: docker build -f deploy/docker/Dockerfile.shadow-test -t shadow-import-check .
      - name: Assert non-root runtime can import the ASGI factory
        run: |
          docker run --rm --network none \
            --entrypoint python shadow-import-check \
            -c 'import os; assert os.geteuid() != 0; from app.test_runtime.sql_agent_test_app import create_app; print("SHADOW_IMPORT_OK")'
