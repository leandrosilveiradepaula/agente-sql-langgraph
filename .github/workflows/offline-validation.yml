name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline validation on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import smoke
        run: python scripts/check_imports.py

      - name: Network guard
        run: python scripts/check_no_network.py

      - name: Full offline checks
        run: python scripts/check_all.py

      - name: Hardcode scan
        run: python scripts/check_hardcodes.py

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Clean-room validation
        run: python scripts/check_clean_room.py

      - name: Whitespace check
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
            git rev-parse --verify $base
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --check "$base...HEAD"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ("${{ github.event_name }}" -eq "push") {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
