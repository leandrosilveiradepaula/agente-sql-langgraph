name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline validation on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import smoke
        run: python scripts/check_imports.py

      - name: Network guard
        run: python scripts/check_no_network.py

      - name: Full offline checks
        run: python scripts/check_all.py

      - name: Verify Supabase retirement, source archive and Shadow tenant preflight offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest
          scripts.test_supabase_retirement_gate
          scripts.test_supabase_runtime_dependency_audit
          scripts.test_g5_archive_supabase_source
          scripts.test_g5_inspect_encrypted_source
          scripts.test_p3_shadow_tenant_login
          -v

      - name: Hardcode scan
        run: python scripts/check_hardcodes.py

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Clean-room validation
        run: python scripts/check_clean_room.py

      - name: Whitespace check
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
            git rev-parse --verify $base
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --check "$base...HEAD"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ("${{ github.event_name }}" -eq "push") {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            git rev-parse --verify "HEAD^" *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "HEAD^"
            } else {
              git diff --check --root HEAD
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  shadow-image-import-smoke:
    name: Shadow image non-root import smoke on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify POSIX-only candidate backup/upgrade path, offline
        run: python3 testar_n8n_parallel_shadow_candidate_upgrade.py
      - name: Validate private n8n workflow renderer (no n8n, SQL or LLM)
        run: |
          python3 testar_n8n_private_shadow_renderer.py
          bash -n scripts/n8n/probe_parallel_shadow_prerequisites_readonly.sh
          bash -n scripts/n8n/audit_shadow_evidence_read_bindings_readonly.sh
      - name: Verify G5 passphrase file-descriptor handling on Linux (offline)
        run: python3 -m unittest scripts.test_g5_archive_supabase_source scripts.test_g5_inspect_encrypted_source -v
      - name: Reproduce restrictive checkout permissions
        run: |
          chmod 700 app/test_runtime
          chmod 600 app/test_runtime/sql_agent_test_app.py
          chmod 600 app/test_runtime/composition.py
      - name: Build real Shadow image
        run: docker build -f deploy/docker/Dockerfile.shadow-test -t shadow-import-check .
      - name: Assert non-root runtime can import the ASGI factory
        run: |
          docker run --rm --network none \
            --entrypoint python shadow-import-check \
            -c 'import os; assert os.geteuid() != 0; from app.test_runtime.sql_agent_test_app import create_app; print("SHADOW_IMPORT_OK")'
      - name: Assert full Uvicorn health and S2S boundary offline in both provider configurations
        shell: bash
        run: |
          set -euo pipefail
          TEST_ENV="$(mktemp)"
          trap 'rm -f "$TEST_ENV"' EXIT
          chmod 600 "$TEST_ENV"
          cat > "$TEST_ENV" <<'EOF'
          LANGGRAPH_RUNTIME_MODE=shadow_test
          LANGGRAPH_HTTP_HOST=0.0.0.0
          LANGGRAPH_HTTP_PORT=8000
          LANGGRAPH_SHADOW_PERSISTENCE=postgres
          LANGGRAPH_ALLOW_REAL_SQL_EXECUTION=false
          LANGGRAPH_SHADOW_DATABASE_DSN=postgresql://shadow.invalid/ci
          CONTEXT_POSTGRES_DSN=postgresql://context.invalid/ci
          SEMANTIC_AGENT_VERSION=ci-fixture-v1
          LANGGRAPH_S2S_TOKEN=ci-not-a-real-secret
          GEMINI_SQL_GENERATOR_MODEL=gemini-2.5-flash
          OPENAI_COMPATIBLE_SQL_ENABLED=false
          EOF
          bash scripts/preflight_shadow_image_offline.sh shadow-import-check "$TEST_ENV"
          sed -i 's/^OPENAI_COMPATIBLE_SQL_ENABLED=false$/OPENAI_COMPATIBLE_SQL_ENABLED=true/' "$TEST_ENV"
          cat >> "$TEST_ENV" <<'EOF'
          OPENAI_COMPATIBLE_SQL_PROVIDER_KEY=provider-fixture
          OPENAI_COMPATIBLE_SQL_CONFIG_VERSION=ci-config-v1
          OPENAI_COMPATIBLE_SQL_BASE_URL=http://10.0.0.4:8080
          OPENAI_COMPATIBLE_SQL_ALLOW_PRIVATE_HTTP=true
          OPENAI_COMPATIBLE_SQL_MODEL=fixture-model
          EOF
          bash scripts/preflight_shadow_image_offline.sh shadow-import-check "$TEST_ENV"
